pilot_node:
  ros__parameters:
    max_altitude_m: 5.0
    max_speed_m_s: 2.5
    transit_speed_m_s: 7.0
    control_period_s: 0.03
    ball_hover_error_gain: 0.18
    ball_hover_deadband: 0.04
    ball_hover_max_step_m: 0.45
    ball_hover_step_scale_min: 0.85
    ball_hover_error_boost_max: 3.0
    ball_hover_error_boost_reference: 0.30
    gimbal_step_scale_reference_deg: 35.0
    gimbal_down_pitch_deg: -90.0
    gimbal_down_yaw_deg: 0.0
    gimbal_guidance_gain_m_per_deg: 0.010
    gimbal_guidance_deadband_deg: 3.0

mission_behavior_tree:
  ros__parameters:
    takeoff_height_m: 3.0
    behavior_tree_tick_s: 0.1
    forward_distance_m: 5.0
    blue_search_height_m: 4.0
    red_search_height_m: 2.0
    yellow_search_height_m: 2.0
    blue_search_lateral_offset_m: 0.0
    red_search_lateral_offset_m: 2.0
    yellow_search_lateral_offset_m: -2.0
    downward_scan_hold_s: 0.35
    early_blue_detection_distance_m: 1.5
    stage_height_m: 0.5
    stage_altitude_tolerance_m: 0.12
    stage_hold_s: 0.6
    pickup_height_m: 0.35
    pickup_altitude_tolerance_m: 0.18
    pickup_center_tolerance_u: 0.035
    pickup_center_tolerance_v: 0.05
    pickup_center_hold_s: 0.4
    position_tolerance_m: 0.35
    gimbal_down_pitch_deg: -90.0
    gimbal_yaw_deg: 0.0
    approach_gimbal_down_tolerance_deg: 6.0
    requested_ball_color: all
    approach_center_tolerance_u: 0.12
    approach_center_tolerance_v: 0.10
    approach_descend_trigger_v: 0.18
    approach_lost_timeout_s: 2.0
    approach_center_hold_s: 0.15
    ball_grab_verify_timeout_s: 6.5

gimbal_controller:
  ros__parameters:
    source_system_id: 1
    source_component_id: 191
    command_interval_s: 0.05
    tracking_p_gain: 0.22
    tracking_deadband_u: 0.02
    tracking_deadband_v: 0.02
    search_waypoint_duration_s: 0.55
    command_slew_rate_deg_s: 180.0
    lock_timeout_s: 1.5

ball_detector:
  ros__parameters:
    world_name: last_mile_logistics_randomized
    camera_model_name: x500_gimbal_0
    publish_interval_s: 0.03
    min_detection_area_px: 15.0
    show_debug_view: true

ball_grabber:
  ros__parameters:
    world_name: last_mile_logistics_randomized
    drone_model_name: x500_gimbal_0
    ball_model_names:
      - ball_red
      - ball_blue
      - ball_yellow
    attach_xy_threshold_m: 0.55
    attach_height_threshold_m: 0.8
    visual_attach_xy_threshold_m: 0.9
    visual_center_tolerance_u: 0.08
    visual_center_tolerance_v: 0.15
    visual_detection_max_age_s: 0.8
    carry_offset_x_m: 0.0
    carry_offset_y_m: 0.0
    carry_offset_z_m: -0.18
    update_rate_hz: 20.0
    service_timeout_ms: 1000
    enabled_at_start: false
