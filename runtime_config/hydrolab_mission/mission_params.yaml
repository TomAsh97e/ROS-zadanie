pilot_node:
  ros__parameters:
    max_altitude_m: 5.0
    max_speed_m_s: 3.0
    hover_contract_topic: /mission/hover_contract
    ibvs_velocity_topic: /pilot/ibvs_velocity_cmd
    ibvs_cmd_timeout_s: 0.5
    raycast_distance_timeout_s: 1.0
    ibvs_max_speed_m_s: 0.8
    ball_hover_error_gain: 0.18
    ball_hover_deadband: 0.05

raycasted_approach_coordinator_node:
  ros__parameters:
    control_interval_s: 0.
    target_topic: /pilot/target_position
    approach_contract_topic: /mission/approach_contract
    gimbal_status_topic: /gimbal/status
    gimbal_orientation_topic: /gimbal/current_orientation_deg
    odom_topic: /fmu/out/vehicle_odometry
    distance_sensor_topic: /fmu/out/distance_sensor
    detection_topic: /vision/ball_detection/result
    require_gimbal_lock: true
    min_altitude_m: 0.25
    min_pitch_down_deg: 5.0
    camera_hfov_deg: 114.6
    camera_vfov_deg: 71.6
    detection_timeout_s: 0.6
    camera_mount_pitch_offset_deg: 0.0
    camera_mount_yaw_offset_deg: 0.0
    camera_offset_x_m: 0.0
    camera_offset_y_m: 0.0
    camera_offset_z_m: 0.0
    max_raycast_distance_m: 25.0

hover_controller:
  ros__parameters:
    control_interval_s: 0.1
    hover_contract_topic: /mission/hover_contract
    detection_topic: /vision/ball_detection/result
    velocity_topic: /pilot/ibvs_velocity_cmd
    detection_timeout_s: 0.6
    enabled_at_start: true
    ibvs_gain_xy: 1.1
    ibvs_ki_xy: 0.1
    ibvs_kd_xy: 0.3
    ibvs_deadband_uv: 0.02
    ibvs_max_speed_m_s: 0.8
    ibvs_derivative_lpf_alpha: 1.0
    ibvs_max_integral_error: 0.4

mission_behavior_tree:
  ros__parameters:
    pool_color_order:
      - red
      - green
      - blue
      - yellow
    final_pool_color: yellow
    # Pool centers in Gazebo world frame (m); match SimWorld_hydrolab/build_world.py
    pool_red_x_m: 4.0
    pool_red_y_m: 20.0
    pool_green_x_m: 5.0
    pool_green_y_m: 45.0
    pool_blue_x_m: -2.0
    pool_blue_y_m: 70.0
    pool_yellow_x_m: 6.0
    pool_yellow_y_m: 95.0
    takeoff_height_m: 5.0
    forward_distance_m: 4.0
    position_tolerance_m: 0.35
    gimbal_down_pitch_deg: -90.0
    gimbal_yaw_deg: 0.0
    requested_ball_color: all
    approach_center_tolerance_u: 0.07
    approach_center_tolerance_v: 0.07
    approach_lost_timeout_s: 2.0
    approach_center_hold_s: 1.0
    approach_final_speed: 1.0
    approach_slowdown_raycast_distance_m: 15.0
    approach_final_speed_raycast_distance_m: 5.0
    target_detected_timeout_s: 1.0
    behavior_change_log_file: /home/mateusz/AbsoluteEdge/SImulation_Hydrolab/logs/behavior_changes.log
    capture_photo_hover_altitude_m: 4.0
    descent_target_altitude_m: 3.0
    # Base waypoint in world frame (m); mission returns here first.
    base_x_m: 0.0
    base_y_m: -5.0
    # Keep separate hover altitudes for base and launch return legs.
    base_hover_altitude_m: 3.0
    launch_hover_altitude_m: 3.0

gimbal_controller:
  ros__parameters:
    source_system_id: 1
    source_component_id: 191
    nadir_pitch_deg: -90.0
    nadir_earth_yaw_deg: 0.0

gimbal_tracker:
  ros__parameters:
    camera_hfov_deg: 114.6
    camera_vfov_deg: 71.6
    tracking_p_gain: 0.5
    tracking_i_gain_pitch: 0.0
    tracking_i_gain_yaw: 0.0
    tracking_d_gain_pitch: 0.0
    tracking_d_gain_yaw: 0.0
    derivative_lpf_alpha: 1.0
    control_interval_s: 0.1
    detection_timeout_s: 0.6
    enabled_at_start: false
    measurement_lpf_alpha: 1.0
    max_pitch_rate_deg_s: 120.0
    max_yaw_rate_deg_s: 180.0
    max_pitch_i_term_deg: 20.0
    max_yaw_i_term_deg: 20.0
    min_yaw_deg: -180.0
    max_yaw_deg: 180.0

ball_detector:
  ros__parameters:
    world_name: hydrolab_built
    camera_model_name: x500_gimbal_0
    publish_interval_s: 0.2
    min_detection_area_px: 15.0
    show_debug_view: true

ball_grabber:
  ros__parameters:
    world_name: hydrolab_built
    drone_model_name: x500_gimbal_0
    ball_model_names:
      - ball_red
      - ball_blue
      - ball_yellow
    attach_xy_threshold_m: 0.35
    attach_height_threshold_m: 3.0
    carry_offset_x_m: 0.0
    carry_offset_y_m: 0.0
    carry_offset_z_m: -0.18
    update_rate_hz: 20.0
    service_timeout_ms: 100
    enabled_at_start: false
